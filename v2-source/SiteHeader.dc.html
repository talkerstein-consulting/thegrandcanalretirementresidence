<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%;">
  <header id="gc-header" style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #FFFDF9; box-shadow: 0 3px 16px rgba(43,35,32,0.08);">

    <div class="gc-hdr-top" style="max-width: 1280px; margin: 0 auto; padding: 10px 32px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px;">

      <div style="justify-self: start;">
        <a class="gc-phone" href="tel:2894800125" aria-label="Call 289 480 0125" style="display: flex; align-items: center; gap: 14px; padding: 6px; color: #10366F;" style-hover="color: #9C4A2E;">
          <span aria-hidden="true" style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 50%; background: #EAF2FA; border: 2px solid #C6DCEF; font-size: 23px;">☎</span>
          <span>
            <span class="gc-phone-txt" style="display: block; font-size: 18px; font-weight: 700; color: #4A3F35;">Book your tour now</span>
            <span class="gc-phone-txt" style="display: block; font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 1.1;">289·480·0125</span>
          </span>
        </a>
      </div>

      <a href="/" style="justify-self: center; display: block;" aria-label="The Grand Canal Retirement Residence home page">
        <img class="gc-logo" src="assets/grand-canal-logo.png" alt="The Grand Canal Retirement Residence" style="height: 96px; width: auto; display: block;">
      </a>

      <div style="justify-self: end;">
        <a class="gc-cta" href="/location#contact" style="display: inline-block; background: #9C4A2E; color: #FFF8EF; padding: 20px 32px; border-radius: 999px; font-weight: 800; font-size: 20px; box-shadow: 0 12px 26px -14px rgba(156,74,46,0.95);" style-hover="background: #82381F; color: #FFF8EF;">Arrange a visit</a>
      </div>
    </div>

    <nav aria-label="Main" style="border-top: 2px solid #EFE4D4; background: #FCF8F2;">
      <div class="gc-nav" style="max-width: 1280px; margin: 0 auto; padding: 0 22px; display: flex; flex-wrap: wrap; justify-content: center;">
        <a href="/suites" style="font-size: 20px; font-weight: 700; color: #2B2320; padding: 17px 24px; border-bottom: 5px solid transparent;" style-hover="color: #9C4A2E; border-bottom: 5px solid #9C4A2E; background: #F7EEE0;">Suites</a>
        <a href="/dining" style="font-size: 20px; font-weight: 700; color: #2B2320; padding: 17px 24px; border-bottom: 5px solid transparent;" style-hover="color: #9C4A2E; border-bottom: 5px solid #9C4A2E; background: #F7EEE0;">Dining</a>
        <a href="/amenities" style="font-size: 20px; font-weight: 700; color: #2B2320; padding: 17px 24px; border-bottom: 5px solid transparent;" style-hover="color: #9C4A2E; border-bottom: 5px solid #9C4A2E; background: #F7EEE0;">Amenities</a>
        <a href="/care" style="font-size: 20px; font-weight: 700; color: #2B2320; padding: 17px 24px; border-bottom: 5px solid transparent;" style-hover="color: #9C4A2E; border-bottom: 5px solid #9C4A2E; background: #F7EEE0;">Care</a>
        <a href="/lifestyle" style="font-size: 20px; font-weight: 700; color: #2B2320; padding: 17px 24px; border-bottom: 5px solid transparent;" style-hover="color: #9C4A2E; border-bottom: 5px solid #9C4A2E; background: #F7EEE0;">Lifestyle</a>
        <a href="/location" style="font-size: 20px; font-weight: 700; color: #2B2320; padding: 17px 24px; border-bottom: 5px solid transparent;" style-hover="color: #9C4A2E; border-bottom: 5px solid #9C4A2E; background: #F7EEE0;">Location</a>
      </div>
    </nav>

    <div aria-hidden="true" style="height: 4px; background: linear-gradient(90deg, #0B2650 0%, #2C7FB8 28%, #79C4EA 50%, #2C7FB8 72%, #0B2650 100%);"></div>
  </header>

  <a id="gc-float-cta" href="/location#contact" style="position: fixed; right: 26px; bottom: 26px; z-index: 1001; display: inline-flex; align-items: center; gap: 12px; background: #9C4A2E; color: #FFF8EF; padding: 20px 30px; border-radius: 999px; font-weight: 800; font-size: 20px; box-shadow: 0 18px 40px -14px rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transform: translateY(14px); transition: opacity 300ms ease, transform 300ms ease;" style-hover="background: #82381F; color: #FFF8EF;">
    <span aria-hidden="true" style="font-size: 22px;">☎</span>Arrange a visit
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    // The header is fixed, so the page needs top padding equal to its height.
    // That height changes with viewport width (the top bar stacks on narrow
    // screens) and again once webfonts load, so measure it instead of guessing.
    this._sync = () => {
      const h = document.getElementById('gc-header');
      if (!h) return;
      const px = h.offsetHeight + 'px';
      document.body.style.paddingTop = px;
      document.documentElement.style.scrollPaddingTop = px;
    };

    this._onScroll = () => {
      const el = document.getElementById('gc-float-cta');
      if (!el) return;
      const show = window.scrollY > 560;
      el.style.opacity = show ? '1' : '0';
      el.style.pointerEvents = show ? 'auto' : 'none';
      el.style.transform = show ? 'translateY(0)' : 'translateY(14px)';
    };

    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._sync);
    this._sync();
    this._onScroll();

    const hdr = document.getElementById('gc-header');
    if (hdr && 'ResizeObserver' in window) {
      this._ro = new ResizeObserver(this._sync);
      this._ro.observe(hdr);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this._sync);
    this._t = setTimeout(this._sync, 400);

    // The page body renders after the browser has already acted on location.hash,
    // so a link like "...Location.dc.html#contact" lands at the top of the page.
    // Re-apply the hash once the target exists, offset by the fixed header, and
    // stop as soon as the visitor scrolls for themselves.
    this._userMoved = false;
    this._noteMove = () => { this._userMoved = true; };
    ['wheel', 'touchmove', 'keydown'].forEach((e) =>
      window.addEventListener(e, this._noteMove, { passive: true })
    );

    this._goToHash = () => {
      if (!location.hash) return false;
      let id = location.hash.slice(1);
      try { id = decodeURIComponent(id); } catch (e) { /* keep raw */ }
      const el = document.getElementById(id);
      if (!el) return false;
      const hdr = document.getElementById('gc-header');
      const off = (hdr ? hdr.offsetHeight : 0) + 12;
      // 'auto' defers to the page's scroll-behavior: smooth, and the animation
      // gets cancelled by the later retries; 'instant' always lands.
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - off, behavior: 'instant' });
      return true;
    };

    this._hashTimers = [0, 200, 500, 1000, 1800].map((d) =>
      setTimeout(() => { if (!this._userMoved) this._goToHash(); }, d)
    );
    this._onHash = () => { this._userMoved = false; this._goToHash(); };
    window.addEventListener('hashchange', this._onHash);
  }

  componentWillUnmount() {
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
    if (this._sync) window.removeEventListener('resize', this._sync);
    if (this._ro) this._ro.disconnect();
    if (this._t) clearTimeout(this._t);
    if (this._hashTimers) this._hashTimers.forEach(clearTimeout);
    if (this._onHash) window.removeEventListener('hashchange', this._onHash);
    if (this._noteMove) ['wheel', 'touchmove', 'keydown'].forEach((e) =>
      window.removeEventListener(e, this._noteMove)
    );
    document.body.style.paddingTop = '';
    document.documentElement.style.scrollPaddingTop = '';
  }
}
</script>
</body>
</html>
